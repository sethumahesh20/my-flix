<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyFlix - Personal Vault</title>

  <style>
    :root {
      --bg-black: #141414;
      --card-bg: #181818;
      --accent-red: #E50914;
      --text-white: #ffffff;
      --text-gray: #aaaaaa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 50px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 30px;
      background: rgba(20, 20, 20, 0.95);
      border-bottom: 1px solid #222;
      backdrop-filter: blur(10px);
    }

    .brand {
      font-size: 24px;
      font-weight: 900;
      color: var(--accent-red);
      letter-spacing: 2px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 4px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent-red);
      color: #fff;
    }

    .btn-primary:hover {
      background: #b80710;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .container {
      padding: 30px;
      max-width: 1300px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 20px;
      margin-bottom: 20px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #252525;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.7);
      border-color: #444;
    }

    .thumbnail-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      position: relative;
    }

    .thumbnail-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
      font-size: 24px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card:hover .play-overlay {
      opacity: 1;
    }

    .card-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-gray);
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #ff4747;
      cursor: pointer;
      font-size: 12px;
    }

    .delete-btn:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      background: #202020;
      width: 90%;
      max-width: 400px;
      padding: 24px;
      border-radius: 8px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-gray);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      background: #111;
      border: 1px solid #333;
      color: #fff;
      border-radius: 4px;
    }

    .form-group input:focus {
      border-color: var(--accent-red);
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 0;
      color: var(--text-gray);
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">MYFLIX</div>

    <div class="header-actions">
      <button class="btn btn-secondary" onclick="exportData()">
        Backup
      </button>

      <button class="btn btn-secondary" onclick="importData()">
        Restore
      </button>

      <button class="btn btn-primary" onclick="openModal()">
        + Add Video
      </button>
    </div>
  </header>

  <main class="container">

    <div class="section-title">
      <span>Personal Unlisted Vault</span>

      <span
        id="videoCount"
        style="font-size: 13px; color: var(--text-gray);"
      ></span>
    </div>

    <div
      class="video-grid"
      id="videoGrid"
    ></div>

  </main>

  <div
    class="modal-overlay"
    id="modalOverlay"
  >

    <div class="modal-box">

      <h3 style="margin-bottom: 16px;">
        Add Video
      </h3>

      <div class="form-group">

        <label>
          Video Title
        </label>

        <input
          type="text"
          id="videoTitle"
          placeholder="e.g. My Project Edit"
        />

      </div>

      <div class="form-group">

        <label>
          YouTube Link
        </label>

        <input
          type="text"
          id="videoUrl"
          placeholder="https://youtu.be/..."
        />

      </div>

      <div class="modal-actions">

        <button
          class="btn btn-secondary"
          onclick="closeModal()"
        >
          Cancel
        </button>

        <button
          class="btn btn-primary"
          onclick="saveVideo()"
        >
          Save
        </button>

      </div>

    </div>

  </div>

  <script>

    const STORAGE_KEY = "myflix_permanent_db";

    const defaultData = [
      {
        title: "Default Unlisted Setup",
        url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
        thumb: "https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg"
      }
    ];

    function extractVideoId(url) {

      const match = url.trim().match(
        /^.*(youtu.be\/|v\/|embed\/|watch\?v=|&v=)([^#&?]*).*/
      );

      return (
        match &&
        match[2].length === 11
      )
        ? match[2]
        : null;
    }

    function loadVideos() {

      const saved =
        localStorage.getItem(STORAGE_KEY);

      if (!saved) {

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(defaultData)
        );

        return defaultData;
      }

      try {

        return JSON.parse(saved);

      } catch (e) {

        return defaultData;
      }
    }

    function render() {

      const videos = loadVideos();

      const grid =
        document.getElementById("videoGrid");

      document.getElementById("videoCount")
        .innerText = `${videos.length} Videos`;

      if (videos.length === 0) {

        grid.innerHTML = `
          <div class="empty-state">
            No videos found.
            Click <b>+ Add Video</b> to add one.
          </div>
        `;

        return;
      }

      grid.innerHTML = videos.map((v, i) => `

        <div
          class="card"
          onclick="window.open('${v.url}', '_blank')"
        >

          <div class="thumbnail-wrap">

            <img
              src="${v.thumb}"
              alt="${v.title}"
            />

            <div class="play-overlay">
              ▶
            </div>

          </div>

          <div class="card-info">

            <div
              class="card-title"
              title="${v.title}"
            >
              ${v.title}
            </div>

            <div class="card-meta">

              <span>
                Unlisted
              </span>

              <button
                class="delete-btn"
                onclick="deleteVideo(event, ${i})"
              >
                Delete
              </button>

            </div>

          </div>

        </div>

      `).join("");
    }

    function saveVideo() {

      const title =
        document.getElementById("videoTitle")
          .value.trim();

      const rawUrl =
        document.getElementById("videoUrl")
          .value.trim();

      if (!title || !rawUrl) {

        alert(
          "Title and URL rendu enter chey bro!"
        );

        return;
      }

      const id =
        extractVideoId(rawUrl);

      const url =
        id
          ? `https://www.youtube.com/watch?v=${id}`
          : rawUrl;

      const thumb =
        id
          ? `https://img.youtube.com/vi/${id}/hqdefault.jpg`
          : "https://via.placeholder.com/320x180?text=No+Thumbnail";

      const videos =
        loadVideos();

      videos.unshift({
        title,
        url,
        thumb
      });

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(videos)
      );

      closeModal();

      render();
    }

    function deleteVideo(e, index) {

      e.stopPropagation();

      if (confirm("Ee video delete cheyala?")) {

        const videos =
          loadVideos();

        videos.splice(index, 1);

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(videos)
        );

        render();
      }
    }

    function openModal() {

      document.getElementById("videoTitle")
        .value = "";

      document.getElementById("videoUrl")
        .value = "";

      document.getElementById("modalOverlay")
        .style.display = "flex";
    }

    function closeModal() {

      document.getElementById("modalOverlay")
        .style.display = "none";
    }

    function exportData() {

      const data =
        localStorage.getItem(STORAGE_KEY) || "[]";

      const blob =
        new Blob(
          [data],
          { type: "application/json" }
        );

      const a =
        document.createElement("a");

      a.href =
        URL.createObjectURL(blob);

      a.download =
        "myflix_videos.json";

      a.click();
    }

    function importData() {

      const input =
        document.createElement("input");

      input.type = "file";
      input.accept = ".json";

      input.onchange = (e) => {

        const file =
          e.target.files[0];

        const reader =
          new FileReader();

        reader.onload = (event) => {

          try {

            JSON.parse(
              event.target.result
            );

            localStorage.setItem(
              STORAGE_KEY,
              event.target.result
            );

            render();

            alert(
              "Backup restored successfully!"
            );

          } catch(err) {

            alert(
              "Invalid JSON file!"
            );
          }
        };

        reader.readAsText(file);
      };

      input.click();
    }

    document
      .getElementById("modalOverlay")
      .addEventListener("click", (e) => {

        if (
          e.target.id === "modalOverlay"
        ) {
          closeModal();
        }

      });

    render();

  </script>

</body>
</html>
